<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEGGITV - Kontakt</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-page {
            min-height: 100vh;
            padding: 150px 5% 70px;
            background: #030712;
            color: #ffffff;
            text-align: center;
        }

        .contact-page h1 {
            margin-bottom: 14px;
            font-size: clamp(2.2rem, 5vw, 4rem);
        }

        .contact-intro {
            color: #cbd5e1;
            font-size: 1.1rem;
        }

        .contact-cards {
            width: min(1100px, 100%);
            margin: 42px auto 0;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
        }

        .contact-card {
            min-height: 180px;
            padding: 30px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #111827;
            border: 1px solid #26354d;
            border-radius: 14px;
            color: #ffffff;
            text-decoration: none;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .contact-card:hover,
        .contact-card:focus-visible {
            transform: translateY(-6px);
            border-color: #38bdf8;
            box-shadow: 0 16px 36px rgba(56, 189, 248, 0.2);
        }

        .contact-icon {
            font-size: 2rem;
        }

        .contact-card h2 {
            font-size: 1.45rem;
        }

        .contact-card p {
            color: #cbd5e1;
            overflow-wrap: anywhere;
        }

        @media (max-width: 900px) {
            .contact-page {
                padding-top: 55px;
            }

            .contact-cards {
                grid-template-columns: 1fr;
                max-width: 520px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a class="logo-link" href="index.html" aria-label="Hjem">
            <img class="logo" src="Designer%20(56).png" alt="GEGGITV-logo">
        </a>

        <nav class="navigation" aria-label="Hovedmeny">
            <a href="index.html">Hjem</a>
            <a href="videoer.html">Videoer</a>
            <a href="kontakt.html">Kontakt</a>
            <a href="pc-specs.html">PC Specs</a>
            <a href="om.html">Om</a>
        </nav>
    </header>

    <main class="contact-page">
        <h1>KONTAKT &amp; LENKER</h1>
        <p class="contact-intro">Kontakt GEGGITV eller følg kanalene.</p>

        <section class="contact-cards" aria-label="Kontakt og sosiale lenker">
            <a class="contact-card" href="mailto:GEGGITV@Hotmail.com">
                <span class="contact-icon" aria-hidden="true">✉</span>
                <h2>E-post</h2>
                <p>GEGGITV@Hotmail.com</p>
            </a>

            <a class="contact-card" href="https://www.youtube.com/@GeirArne" target="_blank" rel="noopener noreferrer">
                <span class="contact-icon" aria-hidden="true">▶</span>
                <h2>YouTube</h2>
                <p>@GeirArne</p>
            </a>

            <a class="contact-card" href="https://www.twitch.tv/geggi1984" target="_blank" rel="noopener noreferrer">
                <span class="contact-icon" aria-hidden="true">●</span>
                <h2>Twitch</h2>
                <p>geggi1984</p>
            </a>
        </section>
    </main>
</body>
</html>
